services:
  db:
    image: postgres:15-alpine
    container_name: jeff-tune-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-jeff_tune_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: jeff-tune-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-jeff_tune_db}
      SECRET_KEY: ${SECRET_KEY:-supersecretkey}
      HF_TOKEN: ${HF_TOKEN}
    depends_on:
      - db
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build: ./frontend
    container_name: jeff-tune-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:


