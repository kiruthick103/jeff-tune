<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jeff Tune-1 Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <button type="button" class="btn-new-chat" id="btnNewChat" aria-label="New chat">
          <span class="icon-plus"></span>
          New Chat
        </button>
      </div>
      <div class="sidebar-chats" id="chatHistory">
        <p class="sidebar-placeholder">No chats yet</p>
      </div>
      <div class="sidebar-footer">
        <label class="model-label" for="modelSelect">Model</label>
        <select id="modelSelect" class="model-select" aria-label="Select AI model">
          <option value="">Auto (smart routing)</option>
        </select>
        <button type="button" class="btn-settings" id="btnSettings" aria-label="Settings">Settings</button>
      </div>
    </aside>
    <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
      <span></span><span></span><span></span>
    </button>
    <main class="main">
      <header class="header">
        <h1 class="header-title">Jeff Tune-1 Pro</h1>
      </header>
      <div class="messages-wrap">
        <div class="messages" id="messages">
          <div class="welcome" id="welcome">
            <p>Ask anything. I'll use the best model for your question.</p>
            <p class="welcome-hint">Try: code, story, or a general question.</p>
          </div>
        </div>
        <div class="typing-indicator" id="typingIndicator" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
      </div>
      <div class="input-wrap">
        <form class="input-form" id="chatForm">
          <textarea id="userInput" rows="1" placeholder="Message Jeff Tune-1 Pro…" maxlength="16000"></textarea>
          <button type="submit" class="btn-send" id="btnSend" aria-label="Send">
            <span class="icon-send"></span>
          </button>
        </form>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
